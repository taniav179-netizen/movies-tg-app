<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Videoteca</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #e50914;
      --accent-hover: #b80710;
      --btn-bg: #334155;
      --btn-text: #f8fafc;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --tag-bg: rgba(229, 9, 20, 0.15);
      --tag-text: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 80px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* Поиск и фильтры */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background-color: var(--btn-bg);
      color: var(--text-muted);
      border: none;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #fff;
    }

    /* Список фильмов */
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .movie-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .poster-container {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-color: #0b1120;
      position: relative;
      overflow: hidden;
    }

    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .poster-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 2rem;
    }

    .movie-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 4px;
    }

    .movie-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .movie-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 6px;
      width: fit-content;
      margin-top: 4px;
      font-weight: 600;
    }

    .badge-por_ver { background: #3b82f6; color: #fff; }
    .badge-visto { background: #10b981; color: #fff; }
    .badge-vio_tania { background: #ec4899; color: #fff; }
    .badge-vio_gonza { background: #8b5cf6; color: #fff; }
    .badge-incompleto { background: #f59e0b; color: #fff; }

    .movie-comment {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-style: italic;
      margin-top: 4px;
      background: rgba(0, 0, 0, 0.2);
      padding: 4px 6px;
      border-radius: 6px;
      word-break: break-word;
    }

    .movie-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
      padding-top: 8px;
    }

    .btn-action {
      flex: 1;
      padding: 6px;
      border-radius: 6px;
      border: none;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-edit {
      background-color: var(--btn-bg);
      color: var(--text-main);
    }

    .btn-watch {
      background-color: var(--accent);
      color: white;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 60px;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background: var(--danger-hover);
    }

    .modal-buttons-right {
      display: flex;
      gap: 8px;
    }

    .btn-secondary {
      background: var(--btn-bg);
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🍿 Nuestra Videoteca</h1>
  </header>

  <div class="controls">
    <input type="text" id="search-bar" class="search-input" placeholder="🔍 Buscar por título o país..." oninput="handleSearch()">
    
    <div class="tabs">
      <button class="tab-btn active" onclick="setFilter('todos', this)">Todos</button>
      <button class="tab-btn" onclick="setFilter('por_ver', this)">🍿 Por ver</button>
      <button class="tab-btn" onclick="setFilter('visto', this)">✅ Visto</button>
      <button class="tab-btn" onclick="setFilter('vio_tania', this)">👩 Vio Tania</button>
      <button class="tab-btn" onclick="setFilter('vio_gonza', this)">👨 Vio Gonza</button>
      <button class="tab-btn" onclick="setFilter('incompleto', this)">⏳ Incompleto</button>
    </div>
  </div>

  <div id="movies-container" class="movies-grid"></div>

  <!-- Модальное окно редактирования и удаления -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">✏️ Editar película / serie</div>
      
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label>Título</label>
        <input type="text" id="edit-title" required>
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select id="edit-status">
          <option value="por_ver">🍿 Por ver</option>
          <option value="visto">✅ Visto</option>
          <option value="vio_tania">👩 Vio Tania</option>
          <option value="vio_gonza">👨 Vio Gonza</option>
          <option value="incompleto">⏳ Incompleto</option>
        </select>
      </div>

      <div class="form-group">
        <label>Enlace para ver (URL)</label>
        <input type="url" id="edit-watch-url" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Comentario / Nota</label>
        <textarea id="edit-comment" placeholder="¿Qué les pareció o detalles importantes?"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-delete" onclick="deleteCurrentMovie()">🗑️ Eliminar</button>
        <div class="modal-buttons-right">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="button" class="btn-primary" onclick="saveMovie()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Параметры Supabase
    const SUPABASE_URL = "https://ogsornrclbhzyxcgfljl.supabase.co";
    // Вставьте ваш реальный публичный anon ключ
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nc29ybnJjbGJoenl4Y2dmbGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzQ0NzIsImV4cCI6MjEwNzY1MDQ3Mn0.6jpX0kkpw_t0j38CJU7fWJhOopn-9Iq3Fwr9EJfTbFo";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMovies = [];
    let currentFilter = 'todos';
    let searchQuery = '';

    const statusLabels = {
      "por_ver": "🍿 Por ver",
      "visto": "✅ Visto",
      "vio_tania": "👩 Vio Tania",
      "vio_gonza": "👨 Vio Gonza",
      "incompleto": "⏳ Incompleto"
    };

    // Загрузка фильмов из Supabase
    async function fetchMovies() {
      try {
        const { data, error } = await supabaseClient
          .from('movies')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;
        allMovies = data || [];
        renderMovies();
      } catch (err) {
        console.error("Error al cargar películas:", err);
      }
    }

    function renderMovies() {
      const container = document.getElementById('movies-container');
      container.innerHTML = '';

      const filtered = allMovies.filter(movie => {
        const matchesFilter = (currentFilter === 'todos') || (movie.status === currentFilter);
        const text = `${movie.title || ''} ${movie.country || ''}`.toLowerCase();
        const matchesSearch = text.includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">No se encontraron títulos.</div>';
        return;
      }

      filtered.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        const posterHtml = movie.poster_url 
          ? `<img src="${movie.poster_url}" alt="${movie.title}" loading="lazy">` 
          : `<div class="poster-placeholder">🎬</div>`;

        const watchBtn = movie.watch_url 
          ? `<a href="${movie.watch_url}" target="_blank" class="btn-action btn-watch">▶ Ver</a>` 
          : '';

        const stBadge = movie.status ? `<div class="badge badge-${movie.status}">${statusLabels[movie.status] || movie.status}</div>` : '';
        const commentHtml = movie.comment ? `<div class="movie-comment">“${movie.comment}”</div>` : '';

        card.innerHTML = `
          <div class="poster-container">
            ${posterHtml}
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">
              <span>${movie.year || '—'}</span>
              ${movie.country ? `• <span>${movie.country}</span>` : ''}
            </div>
            ${stBadge}
            ${commentHtml}
            <div class="movie-actions">
              <button class="btn-action btn-edit" onclick="openEditModal(${movie.id})">✏️ Editar</button>
              ${watchBtn}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setFilter(status, btn) {
      currentFilter = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-bar').value;
      renderMovies();
    }

    // Модальное окно
    function openEditModal(id) {
      const movie = allMovies.find(m => m.id === id);
      if (!movie) return;

      document.getElementById('edit-id').value = movie.id;
      document.getElementById('edit-title').value = movie.title || '';
      document.getElementById('edit-status').value = movie.status || 'por_ver';
      document.getElementById('edit-watch-url').value = movie.watch_url || '';
      document.getElementById('edit-comment').value = movie.comment || '';

      document.getElementById('edit-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    // Сохранение изменений
    async function saveMovie() {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value.trim();
      const status = document.getElementById('edit-status').value;
      const watch_url = document.getElementById('edit-watch-url').value.trim() || null;
      const comment = document.getElementById('edit-comment').value.trim() || null;

      if (!title) {
        alert("El título no puede estar vacío.");
        return;
      }

      try {
        const { error } = await supabaseClient
          .from('movies')
          .update({ title, status, watch_url, comment })
          .eq('id', id);

        if (error) throw error;

        closeModal();
        fetchMovies();
      } catch (err) {
        console.error("Error al actualizar:", err);
        alert("Error al guardar los cambios.");
      }
    }

    // Удаление фильма
    async function deleteCurrentMovie() {
      const id = document.getElementById('edit-id').value;
      if (!id) return;

      const confirmed = confirm("¿Estás seguro de que quieres eliminar este título de la videoteca?");
      if (!confirmed) return;

      try {
        const { error } = await supabaseClient
          .from('movies')
          .delete()
          .eq('id', id);

        if (error) throw error;

        closeModal();
        fetchMovies();
      } catch (err) {
        console.error("Error al eliminar:", err);
        alert("Error al eliminar el título. Verifica los permisos en Supabase (RLS Delete).");
      }
    }

    // Первоначальный запуск
    fetchMovies();
  </script>
</body>
</html>
