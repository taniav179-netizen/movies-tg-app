<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Наша Кинотека</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #141414);
      --card-bg: var(--tg-theme-secondary-bg-color, #222222);
      --text: var(--tg-theme-text-color, #ffffff);
      --hint: var(--tg-theme-hint-color, #999999);
      --btn: var(--tg-theme-button-color, #2481cc);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 14px; }
    
    .filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: var(--text); padding: 8px 14px; border-radius: 18px; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .filter-btn.active { background: var(--btn); color: var(--btn-text); border-color: transparent; }
    
    .card { display: flex; background: var(--card-bg); border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
    .poster { width: 95px; min-width: 95px; background: #333; background-size: cover; background-position: center; }
    .content { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .title-row { margin-bottom: 4px; }
    .type-badge { font-size: 10px; background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; text-transform: uppercase; margin-right: 4px; }
    .title { font-size: 16px; font-weight: 600; display: inline; }
    .meta { font-size: 12px; color: var(--hint); margin: 4px 0 10px 0; line-height: 1.4; }
    
    .actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn { border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; text-decoration: none; text-align: center; }
    .btn-watch { background: #2e7d32; color: #fff; }
    .btn-reject { background: #c62828; color: #fff; }
    .btn-reset { background: #555555; color: #fff; }
    .btn-link { background: #1976d2; color: #fff; }
    #empty-state { text-align: center; color: var(--hint); margin-top: 40px; }
  </style>
</head>
<body>

  <!-- Вкладки статусов -->
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('planned')">🍿 К просмотру</button>
    <button class="filter-btn" onclick="setFilter('watched')">✅ Посмотрели</button>
    <button class="filter-btn" onclick="setFilter('rejected')">❌ Не хотим</button>
  </div>

  <div id="movie-list">Загрузка фильмов...</div>

  <script>
    // ВСТАВЬТЕ ВАШИ ДАННЫЕ
    const SUPABASE_URL = "https://ogsornrclbhzyxcgfljl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nc29ybnJjbGJoenl4Y2dmbGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzQ0NzIsImV4cCI6MjEwNzY1MDQ3Mn0.6jpX0kkpw_t0j38CJU7fWJhOopn-9Iq3Fwr9EJfTbFo";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentStatus = 'planned';

    function formatType(type) {
      if (type === 'series') return '📺 Сериал';
      if (type === 'short') return '⏱ Короткий метр';
      return '🎬 Фильм';
    }

    async function loadMovies() {
      const container = document.getElementById('movie-list');
      container.innerHTML = '<p style="color:gray;">Загрузка...</p>';

      const { data, error } = await supabase
        .from('movies')
        .select('*')
        .eq('status', currentStatus)
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = '<p style="color:red;">Ошибка загрузки базы данных.</p>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<div id="empty-state">В этой категории пока ничего нет</div>';
        return;
      }

      container.innerHTML = data.map(m => {
        const posterBg = m.poster_url ? `style="background-image: url('${m.poster_url}')"` : '';
        return `
          <div class="card">
            <div class="poster" ${posterBg}></div>
            <div class="content">
              <div>
                <div class="title-row">
                  <span class="type-badge">${formatType(m.type)}</span>
                  <div class="title">${m.title} ${m.year ? `(${m.year})` : ''}</div>
                </div>
                <div class="meta">${[m.genre, m.country].filter(Boolean).join(' • ')}</div>
              </div>

              <div class="actions">
                ${m.watch_url ? `<a href="${m.watch_url}" target="_blank" class="btn btn-link">Смотреть ↗</a>` : ''}
                ${currentStatus !== 'watched' ? `<button class="btn btn-watch" onclick="updateStatus(${m.id}, 'watched')">Посмотрели</button>` : ''}
                ${currentStatus !== 'rejected' ? `<button class="btn btn-reject" onclick="updateStatus(${m.id}, 'rejected')">Не хочу</button>` : ''}
                ${currentStatus !== 'planned' ? `<button class="btn btn-reset" onclick="updateStatus(${m.id}, 'planned')">Вернуть</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function updateStatus(id, newStatus) {
      await supabase.from('movies').update({ status: newStatus }).eq('id', id);
      loadMovies();
    }

    function setFilter(status) {
      currentStatus = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(status === 'planned' ? 'просмотру' : status === 'watched' ? 'посмотрели' : 'не хотим'));
      });
      loadMovies();
    }

    if (window.Telegram?.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
    loadMovies();
  </script>
</body>
</html>
