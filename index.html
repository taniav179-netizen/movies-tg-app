<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Videoteca</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #e50914;
      --accent-hover: #b80710;
      --btn-bg: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 80px; }

    header { text-align: center; margin-bottom: 16px; }
    header h1 { font-size: 1.5rem; font-weight: 700; }

    .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .search-input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--card-border); background-color: var(--card-bg); color: var(--text-main); font-size: 0.95rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }

    .filter-group-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-top: 4px; }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }

    .tab-btn { background-color: var(--btn-bg); color: var(--text-muted); border: none; padding: 6px 12px; border-radius: 16px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background-color: var(--accent); color: #fff; }

    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .movie-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    
    .poster-container { width: 100%; aspect-ratio: 2 / 3; background-color: #0b1120; position: relative; }
    .poster-container img { width: 100%; height: 100%; object-fit: cover; }
    .poster-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 2rem; }

    .type-tag { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.75); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; backdrop-filter: blur(4px); }

    .movie-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; gap: 4px; }
    .movie-title { font-size: 0.9rem; font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .movie-meta { font-size: 0.72rem; color: var(--text-muted); }

    .badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 6px; width: fit-content; margin-top: 4px; font-weight: 600; }
    .badge-por_ver { background: #3b82f6; color: #fff; }
    .badge-visto { background: #10b981; color: #fff; }
    .badge-vio_tania { background: #ec4899; color: #fff; }
    .badge-vio_gonza { background: #8b5cf6; color: #fff; }
    .badge-incompleto { background: #f59e0b; color: #fff; }

    .movie-comment { font-size: 0.72rem; color: #cbd5e1; font-style: italic; margin-top: 4px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 4px; word-break: break-word; }

    .movie-actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }
    .btn-action { flex: 1; padding: 6px; border-radius: 6px; border: none; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-edit { background-color: var(--btn-bg); color: var(--text-main); }
    .btn-watch { background-color: var(--accent); color: white; }

    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1000; visibility: hidden; opacity: 0; transition: all 0.2s; }
    .modal-overlay.active { visibility: visible; opacity: 1; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; width: 100%; max-width: 420px; padding: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto; }
    .modal-header { font-size: 1.1rem; font-weight: 700; }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 0.78rem; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea { padding: 9px; border-radius: 8px; border: 1px solid var(--card-border); background: #0f172a; color: #fff; font-size: 0.85rem; outline: none; }
    .form-group textarea { resize: vertical; min-height: 50px; }

    .modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 9px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-secondary { background: var(--btn-bg); color: white; border: none; padding: 9px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 9px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🍿 Nuestra Videoteca</h1>
  </header>

  <div class="controls">
    <input type="text" id="search-bar" class="search-input" placeholder="🔍 Buscar por título, género или страна..." oninput="handleSearch()">
    
    <!-- Фильтр по типам -->
    <div class="filter-group-label">Tipo</div>
    <div class="tabs" id="type-tabs">
      <button class="tab-btn active" onclick="setTypeFilter('all', this)">Все варианты</button>
      <button class="tab-btn" onclick="setTypeFilter('movie', this)">🎬 Película</button>
      <button class="tab-btn" onclick="setTypeFilter('series', this)">📺 Serie</button>
      <button class="tab-btn" onclick="setTypeFilter('short', this)">🎞️ Corto</button>
      <button class="tab-btn" onclick="setTypeFilter('doc', this)">📽️ Doc</button>
    </div>

    <!-- Фильтр по статусам -->
    <div class="filter-group-label">Estado</div>
    <div class="tabs" id="status-tabs">
      <button class="tab-btn active" onclick="setStatusFilter('todos', this)">Todos</button>
      <button class="tab-btn" onclick="setStatusFilter('por_ver', this)">🍿 Por ver</button>
      <button class="tab-btn" onclick="setStatusFilter('visto', this)">✅ Visto</button>
      <button class="tab-btn" onclick="setStatusFilter('vio_tania', this)">👩 Tania</button>
      <button class="tab-btn" onclick="setStatusFilter('vio_gonza', this)">👨 Gonza</button>
      <button class="tab-btn" onclick="setStatusFilter('incompleto', this)">⏳ Incompleto</button>
    </div>
  </div>

  <div id="movies-container" class="movies-grid"></div>

  <!-- Модальное окно редактирования -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">✏️ Editar título</div>
      <input type="hidden" id="edit-id">

      <div class="form-group">
        <label>Título</label>
        <input type="text" id="edit-title" required>
      </div>

      <div class="form-group">
        <label>Tipo (Категория)</label>
        <select id="edit-type">
          <option value="movie">🎬 Película</option>
          <option value="series">📺 Serie</option>
          <option value="short">🎞️ Cortometraje</option>
          <option value="doc">📽️ Documental</option>
        </select>
      </div>

      <div class="form-group">
        <label>Género</label>
        <input type="text" id="edit-genre" placeholder="Drama, Terror, Comedia...">
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select id="edit-status">
          <option value="por_ver">🍿 Por ver</option>
          <option value="visto">✅ Visto</option>
          <option value="vio_tania">👩 Vio Tania</option>
          <option value="vio_gonza">👨 Vio Gonza</option>
          <option value="incompleto">⏳ Incompleto</option>
        </select>
      </div>

      <div class="form-group">
        <label>Póster URL (Ссылка на постер)</label>
        <input type="url" id="edit-poster-url" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Enlace para ver (URL)</label>
        <input type="url" id="edit-watch-url" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Comentario / Nota</label>
        <textarea id="edit-comment"></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-delete" onclick="deleteCurrentMovie()">🗑️</button>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="button" class="btn-primary" onclick="saveMovie()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const SUPABASE_URL = "https://ogsornrclbhzyxcgfljl.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nc29ybnJjbGJoenl4Y2dmbGpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNzQ0NzIsImV4cCI6MjEwNzY1MDQ3Mn0.6jpX0kkpw_t0j38CJU7fWJhOopn-9Iq3Fwr9EJfTbFo";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMovies = [];
    let currentStatus = 'todos';
    let currentType = 'all';
    let searchQuery = '';

    const statusLabels = {
      "por_ver": "🍿 Por ver", "visto": "✅ Visto",
      "vio_tania": "👩 Tania", "vio_gonza": "👨 Gonza", "incompleto": "⏳ Incompleto"
    };

    const typeIcons = {
      "series": "📺 Serie", "short": "🎞️ Corto", "doc": "📽️ Doc", "movie": "🎬 Película"
    };

    async function fetchMovies() {
      try {
        const { data, error } = await supabaseClient.from('movies').select('*').order('id', { ascending: false });
        if (error) throw error;
        allMovies = data || [];
        renderMovies();
      } catch (err) {
        console.error("Error al cargar:", err);
      }
    }

    function renderMovies() {
      const container = document.getElementById('movies-container');
      container.innerHTML = '';

      const filtered = allMovies.filter(movie => {
        const matchStatus = (currentStatus === 'todos') || (movie.status === currentStatus);
        const matchType = (currentType === 'all') || (movie.type === currentType);
        const text = `${movie.title || ''} ${movie.genre || ''} ${movie.country || ''}`.toLowerCase();
        const matchSearch = text.includes(searchQuery.toLowerCase());
        return matchStatus && matchType && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">No se encontraron títulos.</div>';
        return;
      }

      filtered.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';

        const posterHtml = movie.poster_url 
          ? `<img src="${movie.poster_url}" alt="${movie.title}" loading="lazy">` 
          : `<div class="poster-placeholder">🎬</div>`;

        const watchBtn = movie.watch_url 
          ? `<a href="${movie.watch_url}" target="_blank" class="btn-action btn-watch">▶ Ver</a>` 
          : '';

        const stBadge = movie.status ? `<div class="badge badge-${movie.status}">${statusLabels[movie.status] || movie.status}</div>` : '';
        const commentHtml = movie.comment ? `<div class="movie-comment">“${movie.comment}”</div>` : '';

        const metaParts = [];
        if (movie.year) metaParts.push(movie.year);
        if (movie.genre) metaParts.push(movie.genre);
        const metaString = metaParts.join(' • ') || '—';

        card.innerHTML = `
          <div class="poster-container">
            ${posterHtml}
            <div class="type-tag">${typeIcons[movie.type] || '🎬 Película'}</div>
          </div>
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta"><span>${metaString}</span></div>
            ${stBadge}
            ${commentHtml}
            <div class="movie-actions">
              <button class="btn-action btn-edit" onclick="openEditModal(${movie.id})">✏️ Editar</button>
              ${watchBtn}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setStatusFilter(status, btn) {
      currentStatus = status;
      document.querySelectorAll('#status-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function setTypeFilter(type, btn) {
      currentType = type;
      document.querySelectorAll('#type-tabs .tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMovies();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-bar').value;
      renderMovies();
    }

    function openEditModal(id) {
      const movie = allMovies.find(m => m.id === id);
      if (!movie) return;

      document.getElementById('edit-id').value = movie.id;
      document.getElementById('edit-title').value = movie.title || '';
      document.getElementById('edit-type').value = movie.type || 'movie';
      document.getElementById('edit-genre').value = movie.genre || '';
      document.getElementById('edit-status').value = movie.status || 'por_ver';
      document.getElementById('edit-poster-url').value = movie.poster_url || '';
      document.getElementById('edit-watch-url').value = movie.watch_url || '';
      document.getElementById('edit-comment').value = movie.comment || '';

      document.getElementById('edit-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.remove('active');
    }

    async function saveMovie() {
      const id = document.getElementById('edit-id').value;
      const title = document.getElementById('edit-title').value.trim();
      const type = document.getElementById('edit-type').value;
      const genre = document.getElementById('edit-genre').value.trim() || null;
      const status = document.getElementById('edit-status').value;
      const poster_url = document.getElementById('edit-poster-url').value.trim() || null;
      const watch_url = document.getElementById('edit-watch-url').value.trim() || null;
      const comment = document.getElementById('edit-comment').value.trim() || null;

      if (!title) { alert("El título no puede estar vacío."); return; }

      try {
        const { error } = await supabaseClient
          .from('movies')
          .update({ title, type, genre, status, poster_url, watch_url, comment })
          .eq('id', id);

        if (error) throw error;

        closeModal();
        fetchMovies();
      } catch (err) {
        console.error("Error al actualizar:", err);
        alert("Error al guardar los cambios.");
      }
    }

    async function deleteCurrentMovie() {
      const id = document.getElementById('edit-id').value;
      if (!id || !confirm("¿Eliminar este título?")) return;

      try {
        const { error } = await supabaseClient.from('movies').delete().eq('id', id);
        if (error) throw error;
        closeModal();
        fetchMovies();
      } catch (err) {
        alert("Error al eliminar.");
      }
    }

    fetchMovies();
  </script>
</body>
</html>
